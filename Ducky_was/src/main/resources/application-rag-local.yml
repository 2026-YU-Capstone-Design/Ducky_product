# Explicit offline mode: never calls OpenAI. Persistent local DB and artifacts.
spring:
  datasource:
    url: jdbc:h2:file:./data/rag-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

security:
  jwt:
    secret: ducky-rag-local-only-change-before-deployment

chat:
  response-mode: extractive

document:
  pipeline-enabled: true
  storage-root: ./data/documents
  worker-url: ${RAG_WORKER_URL:http://127.0.0.1:8091}
  worker-token: ${RAG_WORKER_TOKEN:}

server:
  address: 127.0.0.1
