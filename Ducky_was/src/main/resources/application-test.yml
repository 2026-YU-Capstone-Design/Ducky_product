spring:
  datasource:
    url: jdbc:h2:mem:rubberduck;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

openai:
  api-key:

security:
  jwt:
    secret: test-token-secret
    expiration-seconds: 3600
