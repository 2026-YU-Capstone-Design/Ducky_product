spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rubberduck}
    username: ${DB_USERNAME:rubberduck}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

openai:
  api-key: ${OPENAI_API_KEY:}

security:
  jwt:
    secret: ${JWT_SECRET:ducky-local-dev-token-secret}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
