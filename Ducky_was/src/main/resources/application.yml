spring:
  application:
    name: rubberduck

  datasource:
    url: jdbc:postgresql://localhost:5432/rubberduck
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

openai:
  api-key: ${OPENAI_API_KEY}

server:
  port: 8080