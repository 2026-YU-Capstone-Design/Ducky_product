spring:
  application:
    name: rubberduck

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rubberduck}
    username: ${DB_USERNAME:rubberduck}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

openai:
  api-key: ${OPENAI_API_KEY:}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
  request-timeout-seconds: ${OPENAI_REQUEST_TIMEOUT_SECONDS:30}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

server:
  port: 8080
