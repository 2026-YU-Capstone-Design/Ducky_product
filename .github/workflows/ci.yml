
name: Ducky CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-unit:
    name: Document processor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Ducky_rag/requirements-test.txt
      - run: python -m pip install -r Ducky_rag/requirements-test.txt
      - run: python -m pytest -p no:cacheprovider Ducky_rag/tests -q
        env:
          PYTHONPATH: Ducky_rag

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Ducky_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Ducky_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: API contract regression tests
        run: npm test

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ""

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Ducky_was

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Ducky_was/build.gradle
            Ducky_was/settings.gradle
            Ducky_was/gradle/wrapper/gradle-wrapper.properties

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew clean build --no-daemon
