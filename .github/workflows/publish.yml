
name: Ducky Docker Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    outputs:
      frontend_digest: ${{ matrix.name == 'frontend' && steps.build.outputs.digest || '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./Ducky_web
            image: ghcr.io/2026-yu-capstone-design/ducky-frontend

          - name: backend
            context: ./Ducky_was
            image: ghcr.io/2026-yu-capstone-design/ducky-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record frontend version
        if: matrix.name == 'frontend'
        run: echo "$GITHUB_SHA" > Ducky_web/public/ducky-release.txt

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name == 'main' && 'main' || 'ci-test' }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/2026-YU-Capstone-Design/Ducky_product

  deploy:
    name: Publish deployment target and verify frontend
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: EC2가 가져갈 이미지 지정
        id: rollout
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ $main != "$GITHUB_SHA" ]]; then
            echo "main에 더 최신 커밋이 있어 이 배포를 건너뜁니다."
            exit 0
          fi
          [[ $IMAGE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/2026-yu-capstone-design/ducky-frontend@$IMAGE_DIGEST"
          docker pull "$image"
          build_id=$(docker run --rm --network none --entrypoint cat "$image" .next/BUILD_ID)
          [[ $build_id =~ ^[a-zA-Z0-9_-]+$ ]]
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/2026-yu-capstone-design/ducky-frontend:deploy "$image"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: EC2 자동 갱신 및 ducklab.site 새 버전 확인
        if: steps.rollout.outputs.build_id != ''
        env:
          BUILD_ID: ${{ steps.rollout.outputs.build_id }}
        run: |
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            version=$(curl -fsS --max-time 5 "https://ducklab.site/ducky-release.txt?rev=$GITHUB_SHA") || version=''
            status=$(curl -fsS --max-time 5 -o "$RUNNER_TEMP/ducky-home.html" -w '%{http_code}' "https://ducklab.site/?rev=$GITHUB_SHA") || status=''
            if [[ $version == "$GITHUB_SHA" && $status == 200 ]] && grep -Fq -- "$BUILD_ID" "$RUNNER_TEMP/ducky-home.html"; then
              echo "새 프론트엔드 배포를 확인했습니다: $GITHUB_SHA"
              exit 0
            fi
            sleep 20
          done
          echo "::error::10분 안에 새 버전을 확인하지 못했습니다. EC2의 ducky-frontend-update.timer와 서비스 로그를 확인하세요."
          exit 1
